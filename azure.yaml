# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: azure-functions-ai-services-agent-python
metadata:
  template: azure-functions-ai-services-agent-python
services:
  api:
    project: ./app/
    language: python
    host: function
  web:
    project: ./frontend/
    language: js
    host: staticwebapp
    dist: build
hooks:
  preprovision:
    posix:
      shell: sh
      run: |
        if [ -z "$(azd env get-value AZURE_PRINCIPAL_ID 2>/dev/null)" ]; then
          PRINCIPAL_ID=$(az ad signed-in-user show --query id -o tsv)
          azd env set AZURE_PRINCIPAL_ID "$PRINCIPAL_ID"
        fi
      continueOnError: false
    windows:
      shell: pwsh
      run: |
        if (-not (azd env get-value AZURE_PRINCIPAL_ID 2>$null)) {
          $principalId = az ad signed-in-user show --query id -o tsv
          azd env set AZURE_PRINCIPAL_ID $principalId
        }
      continueOnError: false
  postprovision:
    windows:
      shell: pwsh
      run: .\infra\scripts\createlocalsettings.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./infra/scripts/createlocalsettings.sh
      interactive: true
      continueOnError: false